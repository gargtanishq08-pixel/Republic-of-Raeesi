<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The National Anthem — Republic of Raeesi</title>
  <meta name="description" content="Sing along to “The Empire Needs Builders”, the national anthem of the Republic of Raeesi.">
  <meta property="og:title" content="The Empire Needs Builders: the anthem of the Republic of Raeesi">
  <meta property="og:description" content="Sing along with the lyrics.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#3a0914">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%233a0914'/%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23e2c46d' stroke-width='3'/%3E%3Cpolygon fill='%23e2c46d' points='50,24 56,42 76,42 60,53 66,72 50,60 34,72 40,53 24,42 44,42'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <a class="skip" href="#main">Skip to the content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="decree-line">Please rise</p>
        <h1 class="page-title" id="an-title">The Empire Needs Builders.</h1>
        <p class="page-lede" id="an-sub">The national anthem of the Republic of Raeesi. Press play and sing along.</p>
      </div>
    </section>

    <section class="m-section" aria-labelledby="sing-title">
      <div class="wrap">
        <h2 id="sing-title" class="sr-only">Sing along</h2>
        <div class="anthem" id="an-root">
          <div class="anthem-stage" id="an-stage">
            <video id="an-video" controls playsinline preload="metadata" controlslist="nodownload"></video>
            <div class="karaoke-overlay" id="an-overlay" aria-hidden="true"><p class="k-now" id="k-now"></p><p class="k-next" id="k-next"></p></div>
          </div>
          <div class="anthem-tools" role="group" aria-label="Sing-along options">
            <button type="button" class="btn btn-line btn-sm" id="an-full">Full-screen karaoke</button>
            <button type="button" class="btn btn-line btn-sm" id="an-mode" aria-pressed="false">Lyrics only</button>
            <span class="nudge" role="group" aria-label="Lyrics timing"><span>Lyrics out of step?</span>
              <button type="button" class="btn btn-line btn-sm" id="an-early" aria-label="Show lyrics earlier">Earlier</button>
              <button type="button" class="btn btn-line btn-sm" id="an-late" aria-label="Show lyrics later">Later</button>
              <span class="file-meta" id="an-off">0.0s</span></span>
            <button type="button" class="btn btn-line btn-sm" id="an-share">Share</button>
          </div>
          <p class="file-meta" id="an-msg" role="status" aria-live="polite"></p>
          <div class="lyrics-box" id="an-lyrics" aria-label="Lyrics" tabindex="0"><p class="file-meta">Loading the lyrics…</p></div>
          <p class="file-meta">Tip: tap or click any line to jump to it.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="config.js"></script>
  <script src="supabase-config.js"></script>
  <script src="anthem-data.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script src="anthem.js"></script>
</body>
</html>
